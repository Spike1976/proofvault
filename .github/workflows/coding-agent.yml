name: ProofVault autonomous coding agent
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number to implement"
        required: true
        type: number
permissions:
  contents: write
  pull-requests: write
  issues: read
concurrency:
  group: proofvault-coding-agent
  cancel-in-progress: false
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PROOFVAULT_AGENT_MODEL: ${{ vars.PROOFVAULT_AGENT_MODEL || 'gpt-5.5' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate API configuration
        run: test -n "$OPENAI_API_KEY" || { echo "::error::Add OPENAI_API_KEY as a GitHub Actions repository secret"; exit 1; }
      - name: Configure git identity
        run: |
          git config user.name "proofvault-coding-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create isolated working branch
        run: |
          git checkout -b "agent/issue-${{ inputs.issue_number }}-${{ github.run_id }}"
      - name: Fetch task from GitHub issue
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          gh issue view "$ISSUE_NUMBER" --json title,body,state --jq '.title + "\n\n" + .body' > /tmp/proofvault-task.txt
          echo "AGENT_ISSUE<<EOF" >> "$GITHUB_ENV"
          cat /tmp/proofvault-task.txt >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
      - name: Implement issue, run tests, lint and build; retry failures
        run: python3 .github/scripts/coding_agent.py
      - name: Push verified changes
        run: git push --set-upstream origin HEAD
      - name: Open review-only pull request
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          gh pr create --base main --head "$(git branch --show-current)" \
            --title "Agent: implement issue #$ISSUE_NUMBER" \
            --body "AI-generated change for #$ISSUE_NUMBER. Gradle unit tests, lint and debug build passed in the agent job. Human code review, security review and device tests are required. No auto-merge or release."
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coding-agent-diagnostics
          path: |
            agent-build.log
            agent-result.json
          if-no-files-found: ignore
